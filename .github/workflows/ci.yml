name: CI

on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev,warehouse,reporting,service]"

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

      - name: Types
        run: mypy

      # The warehouse is generated, never committed. If this step fails, the repo is
      # not reproducible and nothing downstream can be trusted.
      - name: Build warehouse
        run: make warehouse

      - name: Test
        run: pytest --cov --cov-report=term-missing --cov-fail-under=85

      - name: dbt data tests
        run: cd warehouse && dbt test --profiles-dir .

      # The regression gate. A pull request that drops execution accuracy by more than two
      # points, or ships a single ungrounded number, or lets one adversarial case through,
      # fails here. This is the difference between a report and a control.
      - name: Evaluation regression gate
        run: make eval-gate

      # Every figure in the generated deck is re-executed against the warehouse. A report
      # whose numbers no longer reproduce is a report that has drifted, and it fails here
      # rather than in a client meeting.
      - name: Report provenance check
        run: make report

  # An editable install makes a packaged application look like a script. Every path resolved
  # from `__file__` relative to the repo works under `-e` and breaks under `pip install .` --
  # which is what the containers do. This job installs the wheel into a clean venv with no
  # source tree and starts both service factories (docs/AUDIT.md, R4-1).
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: pip wheel . --no-deps -w dist/

      - name: Install it somewhere with no source checkout
        run: |
          python -m venv /tmp/clean-venv
          /tmp/clean-venv/bin/pip install dist/*.whl fastapi httpx duckdb sqlglot pyyaml pandas numpy

      - name: The package must find its own data and both factories must start
        working-directory: /tmp
        run: |
          /tmp/clean-venv/bin/python - <<'PY'
          from pathlib import Path
          from campaign_copilot.semantic import SemanticLayer
          from campaign_copilot.prompts import PromptRegistry
          from campaign_copilot.evals import load_golden
          from campaign_copilot.service.executor import create_app as executor_app
          from campaign_copilot.service.app import Settings, create_app as api_app

          assert SemanticLayer.load().metrics, "metrics.yml not found in the wheel"
          assert PromptRegistry.load().prompts, "prompts not found in the wheel"
          assert load_golden(), "eval datasets not found in the wheel"
          executor_app(environ={"PATH": "/usr/bin"})
          api_app(settings=Settings(warehouse_path=Path("/nonexistent.duckdb")))
          print("installed package is self-contained")
          PY

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      # Validated against the real provider schema. Never applied from CI.
      - name: Terraform fmt + validate
        run: |
          cd deploy/terraform
          terraform fmt -check
          terraform init -backend=false
          terraform validate

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      # `strict` + noUncheckedIndexedAccess + exactOptionalPropertyTypes. A new server event
      # that the renderer forgets to handle is a compile error, not a blank panel.
      - run: npx tsc --noEmit
      - run: npm test
