substitutions:
  _REGION: us-central1
  _IMAGE_TAG: manual

steps:
  - id: build-warehouse
    name: python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
    entrypoint: sh
    args:
      - -ceu
      - |
        pip install --no-cache-dir uv==0.11.30
        uv sync --frozen --extra warehouse
        uv run sh scripts/build_warehouse.sh

  - id: build-api
    name: gcr.io/cloud-builders/docker@sha256:f8b08c609fdc392ee6827ff3e1725e4980f7d96bde9f76f4695086405c96c147
    args:
      - build
      - --file=deploy/Dockerfile.api
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/campaign-copilot/api:${_IMAGE_TAG}
      - .
    waitFor: [build-warehouse]

  - id: build-executor
    name: gcr.io/cloud-builders/docker@sha256:f8b08c609fdc392ee6827ff3e1725e4980f7d96bde9f76f4695086405c96c147
    args:
      - build
      - --file=deploy/Dockerfile.executor
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/campaign-copilot/executor:${_IMAGE_TAG}
      - .
    waitFor: [build-warehouse]

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/campaign-copilot/api:${_IMAGE_TAG}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/campaign-copilot/executor:${_IMAGE_TAG}

options:
  logging: CLOUD_LOGGING_ONLY
