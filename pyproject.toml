[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "campaign-copilot"
version = "0.1.0"
description = "An LLM analyst for marketing data: semantic layer, sandboxed tools, and an evaluation harness with a hallucination SLO."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kazmir Fahrier" }]
keywords = ["llm", "agents", "rag", "evaluation", "dbt", "duckdb", "semantic-layer"]

dependencies = [
    "duckdb>=1.0",
    "sqlglot>=25.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
warehouse = ["dbt-core>=1.8", "dbt-duckdb>=1.8"]
reporting = ["python-pptx>=1.0"]
google = ["google-api-python-client>=2.0", "google-auth>=2.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11", "pre-commit>=3.7"]

[tool.hatch.build.targets.wheel]
packages = ["src/campaign_copilot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["src/campaign_copilot"]
branch = true
# _runner.py executes in a subprocess the tracer cannot see. It is exercised by every
# test in test_tools.py's sandbox section; measuring it would require coverage's
# subprocess hooks, which fight with the rlimits we set in preexec_fn.
omit = ["*/tools/_runner.py"]

[tool.ruff]
line-length = 96
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "D"]
ignore = ["D203", "D213", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D101", "D102", "D103", "D107", "ANN001", "ANN201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/campaign_copilot"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["duckdb.*", "yaml.*", "sqlglot.*", "pandas.*", "numpy.*"]
ignore_missing_imports = true

# The vendor SDKs are optional extras, imported lazily inside the adapters. CI does not
# install them, and the package must be usable without either. ScriptedClient is what
# the test suite and the eval harness actually run against.
[[tool.mypy.overrides]]
module = ["anthropic.*", "openai.*", "tiktoken.*", "googleapiclient.*", "pptx.*"]
ignore_missing_imports = true

# python-pptx ships a partial py.typed: CategoryChartData.add_series is untyped upstream.
# The renderer is the only place that touches it.
[[tool.mypy.overrides]]
module = ["campaign_copilot.reporting.render"]
disallow_untyped_calls = false

# The generator is a vectorized numpy/pandas script. numpy's Generator methods are
# untyped upstream, so `disallow_untyped_calls` fires on every `rng.poisson(...)`.
# Silencing it there is honest; silencing it repo-wide would not be. Everything the
# agent actually executes -- semantic layer, guardrails, llm -- stays --strict.
[[tool.mypy.overrides]]
module = ["campaign_copilot.warehouse.generate"]
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false
disable_error_code = ["call-overload"]
